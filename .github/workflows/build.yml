name: Build Sidee

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests and ZIP
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the Windows connection library
        run: python -m pip install paho-mqtt==2.1.0
      - name: Check imports, resources and Python syntax
        run: |
          python -m compileall -q sidee.py macos_launcher.py core tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sidee.py --self-test
      - name: Run all source tests
        run: |
          python -u -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(90, exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); faulthandler.cancel_dump_traceback_later(); raise SystemExit(not result.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_dashboard_selection.js
      - name: Start and stop the source dashboard
        run: python tools/smoke_test.py --source
      - name: Build the existing Windows download
        run: python tools/build_windows_release.py
      - name: Test first-time setup from the actual Windows ZIP
        shell: powershell
        run: |
          $sideeTestRoot = Join-Path $env:RUNNER_TEMP 'Sidee fresh download'
          Expand-Archive -LiteralPath 'dist/sidee-windows.zip' -DestinationPath $sideeTestRoot
          $sideeDownloadRoot = Join-Path $sideeTestRoot 'Sidee'
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sideeDownloadRoot 'start-windows.ps1') -PrepareOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sideeEmbeddedPython = Join-Path $sideeDownloadRoot '.runtime/python-3.13.16-amd64/python.exe'
          python tools/smoke_test.py --source --python $sideeEmbeddedPython --source-root $sideeDownloadRoot
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Sidee-Windows
          path: dist/sidee-windows.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux tests, tarball, deb and rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the Linux connection library and package tools
        run: |
          python -m pip install paho-mqtt==2.1.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
      - name: Check imports, resources and Python syntax
        run: |
          python -m compileall -q sidee.py macos_launcher.py core tools tests
          python sidee.py --self-test
      - name: Check the Linux launcher and packaging scripts
        run: |
          sh -n start-linux.sh packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/sidee
          bash -n packaging/linux/PKGBUILD packaging/linux/sidee.install
          python -c "from tools import build_linux_release as b; print('deb arch:', b.debian_architecture())"
      - name: Run all source tests
        run: |
          python -u -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(90, exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); faulthandler.cancel_dump_traceback_later(); raise SystemExit(not result.wasSuccessful())"
          node --test tests/test_dashboard_selection.js
      - name: Start and stop the source dashboard
        run: python tools/smoke_test.py --source
      - name: Build the Linux tarball, deb and rpm
        run: |
          python tools/build_linux_release.py --version 0.1.4.2
          ls -l dist
      - name: Inspect the built RPM
        run: |
          rpm -qip dist/sidee-*.noarch.rpm
          rpm -qlp dist/sidee-*.noarch.rpm | tee rpm-files.txt
          grep -qx '/usr/bin/sidee' rpm-files.txt
          grep -qx '/usr/share/sidee/sidee.py' rpm-files.txt
          grep -qx '/usr/share/sidee/core/tv-client.bundle' rpm-files.txt
          grep -qx '/usr/share/applications/sidee.desktop' rpm-files.txt
          grep -qx '/usr/lib/systemd/user/sidee.service' rpm-files.txt
      - name: Install the deb system-wide and run its self-test
        run: |
          sudo apt-get install -y ./dist/sidee_*.deb
          sidee --self-test
          dpkg -L sidee | sort
          test -f /usr/share/applications/sidee.desktop
          test -f /usr/lib/systemd/user/sidee.service
          sudo apt-get remove -y sidee
      - name: Test first-time setup from the actual Linux download
        run: |
          download=$(mktemp -d)
          tar xzf dist/sidee-linux.tar.gz -C "$download"
          cd "$download/Sidee"
          # The archive must keep the launchers executable for ./start-linux.sh.
          test -x start-linux.sh
          test -x install.sh
          # --prepare-only always builds the private runtime, even when the
          # workflow's own interpreter already has paho-mqtt installed.
          env -u PYTHONPATH ./start-linux.sh --prepare-only
          test -f .runtime/packages/paho-mqtt-2.1.0/paho/mqtt/client.py
          # A second run reuses the runtime instead of downloading again.
          env -u PYTHONPATH ./start-linux.sh --prepare-only
          # A stale lock from a killed run must not block the next launch.
          mkdir .runtime/setup.lock
          env -u PYTHONPATH ./start-linux.sh --prepare-only
          test ! -e .runtime/setup.lock
          PYTHONPATH="$PWD/.runtime/packages/paho-mqtt-2.1.0" \
            python "$GITHUB_WORKSPACE/tools/smoke_test.py" --source --source-root "$PWD"
      - name: Install into a custom prefix and run the launcher
        run: |
          prefix=$(mktemp -d)/opt
          sh packaging/linux/install.sh --system --prefix "$prefix" --no-systemd
          "$prefix/bin/sidee" --self-test
          test -f "$prefix/share/applications/sidee.desktop"
          grep -q "Exec=$prefix/bin/sidee" "$prefix/share/applications/sidee.desktop"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Sidee-Linux
          path: |
            dist/sidee-linux.tar.gz
            dist/sidee_*.deb
            dist/sidee-*.noarch.rpm
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.architecture }} app and DMG
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python-architecture: arm64
          - runner: macos-15-intel
            architecture: x64
            python-architecture: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.python-architecture }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned macOS build dependencies
        run: python -m pip install -r requirements-build-macos.txt
      - name: Check imports, resources and Python syntax
        run: |
          python -m compileall -q sidee.py macos_launcher.py core tools tests
          python sidee.py --self-test
      - name: Run all source tests
        run: |
          python -u -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(90, exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); faulthandler.cancel_dump_traceback_later(); raise SystemExit(not result.wasSuccessful())"
          node --test tests/test_dashboard_selection.js
      - name: Start and stop the source dashboard
        run: python tools/smoke_test.py --source
      - name: Build and verify the app, native architecture, ZIP and DMG
        env:
          SIDEE_REF_NAME: ${{ github.ref_name }}
          SIDEE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SIDEE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version=0.1.4.2
          if [[ "$SIDEE_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            version="${SIDEE_REF_NAME#v}"
          elif [[ "$SIDEE_COMMIT_MESSAGE" =~ ^release:\ v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          fi
          python tools/build_macos_release.py --architecture '${{ matrix.architecture }}' --version "$version"
      - name: Check the bundled runtime without GUI or a TV
        run: dist/Sidee.app/Contents/MacOS/Sidee --self-test
      - name: Start and stop the actual bundled executable
        run: python tools/smoke_test.py --executable dist/Sidee.app/Contents/MacOS/Sidee
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Sidee-macOS-${{ matrix.architecture }}
          path: |
            dist/Sidee-macOS-${{ matrix.architecture }}.app.zip
            dist/Sidee-macOS-${{ matrix.architecture }}.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Prepare verified release assets
    if: "${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release: v')) }}"
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Sidee-*
          path: release-assets
          merge-multiple: true
      - name: Create or update the draft with verified builds
        env:
          GH_TOKEN: ${{ github.token }}
          SIDEE_REPOSITORY: ${{ github.repository }}
          SIDEE_REF: ${{ github.ref }}
          SIDEE_REF_NAME: ${{ github.ref_name }}
          SIDEE_SHA: ${{ github.sha }}
          SIDEE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          publish=false
          if [[ "$SIDEE_REF" == refs/tags/v* ]]; then
            SIDEE_TAG="$SIDEE_REF_NAME"
          else
            first_line="$(printf '%s\n' "$SIDEE_COMMIT_MESSAGE" | head -n 1)"
            SIDEE_TAG="${first_line#release: }"
            publish=true
          fi
          if ! [[ "$SIDEE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo 'Release versions must use vX.Y.Z or vX.Y.Z.N.' >&2
            exit 1
          fi
          notes_options=(--generate-notes)
          notes_file="docs/releases/${SIDEE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            notes_options=(--notes-file "$notes_file")
          fi
          if ! gh release view "$SIDEE_TAG" --repo "$SIDEE_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$publish" == true ]]; then
              gh release create "$SIDEE_TAG" --repo "$SIDEE_REPOSITORY" --target "$SIDEE_SHA" --draft --title "Sidee $SIDEE_TAG (Beta)" "${notes_options[@]}"
            else
              gh release create "$SIDEE_TAG" --repo "$SIDEE_REPOSITORY" --verify-tag --draft --title "Sidee $SIDEE_TAG" "${notes_options[@]}"
            fi
          fi
          if [[ "$(gh release view "$SIDEE_TAG" --repo "$SIDEE_REPOSITORY" --json isDraft --jq .isDraft)" != 'true' ]]; then
            echo 'The release is already published; its assets will not be overwritten.' >&2
            exit 1
          fi
          gh release upload "$SIDEE_TAG" release-assets/* --repo "$SIDEE_REPOSITORY" --clobber
          if [[ "$publish" == true ]]; then
            gh release edit "$SIDEE_TAG" --repo "$SIDEE_REPOSITORY" --draft=false --prerelease
          fi
